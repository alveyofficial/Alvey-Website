# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 2

env:
  - variable: VITE_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_FIREBASE_MEASUREMENT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: VITE_NOTIFICATIONS_FUNCTION_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: OPENAI_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: DISCORD_WEBHOOK_URL
    availability:
      - BUILD
      - RUNTIME
