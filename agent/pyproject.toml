[project]
name = "alvey-classroom-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[daily,google]>=0.0.51",
    "google-cloud-firestore>=2.16.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
